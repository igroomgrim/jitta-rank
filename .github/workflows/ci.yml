name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1
  API_BASE_URL: https://thecollector-staging-l6chkvtlsa-df.a.run.app/

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated sources (*.g.dart) are gitignored, so they must be built
      # before anything can analyze or run. This also rebuilds the mockito
      # mocks, which catches a stale checked-in mock against a bumped package.
      - name: Generate code
        run: dart run build_runner build

      - name: Verify generated mocks are not stale
        run: git diff --exit-code -- '*.mocks.dart'

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn
